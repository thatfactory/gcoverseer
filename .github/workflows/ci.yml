---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-format:
    name: Swift Format
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate latest Codex review policy
        uses: thatfactory/agent-guidelines/.github/actions/codex-review-policy@1c957669005eea010131c53f0a4146db2ccf7859
        with:
          profile: full
      - name: Validate Consumer Integration
        run: AgentGuidelines/Scripts/validate_consumer_setup.swift

      - name: Run Strict Swift Format
        run: AgentGuidelines/Scripts/swift_format.sh lint-strict Package.swift Sources Tests

  test:
    name: Test
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Clear SwiftPM Caches
        run: |
          rm -rf ~/.swiftpm
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm
          rm -rf .swiftpm
          rm -rf .build

      - name: Run Tests
        run: swift test -v
